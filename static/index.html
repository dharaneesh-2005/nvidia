<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nvidia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link href="/static/css/search.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html {
            background: #1a1a1a;
            min-height: 100vh;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #2a2a2a;
            background-attachment: fixed;
            color: #e0e0e0;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }
        
        header {
            background: rgba(40, 40, 40, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(80, 80, 80, 0.3);
            padding: 8px 12px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        h1 {
            font-size: 18px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .status {
            font-size: 11px;
            padding: 4px 10px;
            background: rgba(60, 60, 60, 0.8);
            border-radius: 12px;
            font-weight: 600;
        }
        
        .status.connected {
            background: rgba(16, 163, 127, 0.4);
        }
        
        .btn-group {
            display: flex;
            gap: 6px;
        }
        
        .btn {
            background: rgba(60, 60, 60, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 100, 100, 0.4);
            color: #e0e0e0;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
        }
        
        .btn:active {
            transform: scale(0.95);
            background: rgba(80, 80, 80, 0.9);
        }
        
        .btn-debug {
            background: rgba(231, 76, 60, 0.3);
            border-color: rgba(231, 76, 60, 0.5);
        }
        
        .btn-mic {
            background: rgba(52, 152, 219, 0.3);
            border-color: rgba(52, 152, 219, 0.5);
            position: relative;
        }
        
        .btn-mic.recording {
            background: rgba(231, 76, 60, 0.5);
            border-color: rgba(231, 76, 60, 0.7);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .multi-capture-indicator {
            position: fixed;
            left: 50%;
            bottom: calc(12px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid rgba(80, 80, 80, 0.4);
            color: #e0e0e0;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            z-index: 1000;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            max-width: 92vw;
            text-align: center;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
        }
        
        .multi-capture-indicator.active {
            display: block;
        }
        
        .multi-capture-indicator .mc-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            opacity: 0.8;
        }
        
        .multi-capture-indicator .mc-count {
            font-size: 16px;
            font-weight: 700;
            margin-top: 2px;
        }
        
        .multi-capture-indicator .mc-hint {
            font-size: 11px;
            opacity: 0.85;
            margin-top: 2px;
        }

        .multi-capture-indicator .mc-cancel {
            margin-top: 8px;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(231, 76, 60, 0.6);
            background: rgba(231, 76, 60, 0.3);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            min-width: 120px;
            touch-action: manipulation;
        }
        
        .multi-capture-indicator .mc-cancel:active {
            transform: scale(0.98);
            background: rgba(231, 76, 60, 0.45);
        }
        
        @media (max-width: 480px) {
            .multi-capture-indicator {
                padding: 12px 16px;
                font-size: 14px;
            }
            .multi-capture-indicator .mc-count {
                font-size: 18px;
            }
            .multi-capture-indicator .mc-hint {
                display: none;
            }
            .multi-capture-indicator .mc-cancel {
                min-width: 160px;
                padding: 10px 18px;
                font-size: 14px;
            }
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 8px 80px 8px;
            -webkit-overflow-scrolling: touch;
        }
        
        .message {
            margin-bottom: 12px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .msg-q {
            background: rgba(50, 50, 50, 0.9);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(80, 80, 80, 0.3);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            position: relative;
        }
        
        .solve-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(16, 163, 127, 0.3);
            border: 1px solid rgba(16, 163, 127, 0.5);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .solve-btn:hover {
            background: rgba(16, 163, 127, 0.5);
        }
        
        .solve-btn:active {
            transform: scale(0.95);
        }
        
        .msg-a {
            background: rgba(40, 40, 40, 0.95);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(80, 80, 80, 0.3);
            border-radius: 12px;
            padding: 12px;
            border-left: 3px solid #10a37f;
        }
        
        .msg-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            opacity: 0.8;
        }
        
        .msg-content {
            font-size: 16px;
            line-height: 1.6;
            word-wrap: break-word;
            overflow-wrap: break-word;
            color: #e0e0e0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            max-width: 100%;
            overflow-x: auto;
        }
        .heading1 { font-size: 1.5em; font-weight: 700; margin: 0.8em 0; }
        .heading2 { font-size: 1.3em; font-weight: 600; margin: 0.7em 0; }
        .heading3 { font-size: 1.1em; font-weight: 500; margin: 0.6em 0; }
        
        .msg-content p {
            margin: 8px 0;
        }
        
        .msg-content strong {
            font-weight: 700;
        }
        
        .msg-content h2 {
            font-size: 17px;
            font-weight: 700;
            margin: 12px 0 8px 0;
        }
        
        .msg-content h3 {
            font-size: 16px;
            font-weight: 700;
            margin: 10px 0 6px 0;
        }
        
        /* Groq-style heading classes */
        .heading1 { 
            font-size: 1.5em; 
            font-weight: 700; 
            margin: 0.8em 0; 
        }
        .heading2 { 
            font-size: 1.3em; 
            font-weight: 600; 
            margin: 0.7em 0; 
        }
        .heading3 { 
            font-size: 1.1em; 
            font-weight: 500; 
            margin: 0.6em 0; 
        }
        
        .msg-content ul, .msg-content ol {
            margin: 8px 0;
            padding-left: 24px;
        }
        
        .msg-content li {
            margin: 4px 0;
        }
        
        .loading {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-style: italic;
            opacity: 0.9;
        }
        
        .loading::after {
            content: '';
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: currentColor;
            animation: loadingDots 1.4s infinite;
        }
        
        @keyframes loadingDots {
            0%, 20% { box-shadow: 8px 0 0 currentColor, 16px 0 0 currentColor; }
            40% { box-shadow: 8px 0 0 transparent, 16px 0 0 currentColor; }
            60% { box-shadow: 8px 0 0 currentColor, 16px 0 0 transparent; }
            80%, 100% { box-shadow: 8px 0 0 currentColor, 16px 0 0 currentColor; }
        }
        
        .code-block {
            margin: 12px 0;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(25, 25, 25, 0.98);
            font-size: 12px;
            border: 1px solid rgba(80, 80, 80, 0.2);
            width: 100%;
            display: block;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        
        .code-header {
            background: rgba(20, 20, 20, 0.98);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(80, 80, 80, 0.2);
        }
        
        .code-lang {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            opacity: 0.8;
        }
        
        .copy-btn {
            background: rgba(16, 163, 127, 0.3);
            border: 1px solid rgba(16, 163, 127, 0.5);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .copy-btn.copied {
            background: rgba(16, 163, 127, 0.6);
        }
        
        pre[class*="hljs"], pre code {
            margin: 0 !important;
            background: rgba(25, 25, 25, 0.98) !important;
            padding: 12px !important;
            max-height: 400px;
            overflow-x: auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            width: 100%;
            white-space: pre !important;
            word-break: normal !important;
            word-wrap: normal !important;
            display: block;
            font-size: 12px !important;
            line-height: 1.5 !important;
            tab-size: 4;
            -moz-tab-size: 4;
            border-radius: 0 0 8px 8px;
        }
        
        code[class*="hljs"], pre code {
            font-family: 'Fira Code', 'Courier New', monospace !important;
            font-size: 12px !important;
            line-height: 1.5 !important;
            text-shadow: none !important;
            white-space: pre !important;
            word-break: normal !important;
            word-wrap: normal !important;
            overflow: visible;
            display: block;
            tab-size: 4;
            -moz-tab-size: 4;
        }
        
        .msg-content code:not(.hljs) {
            background: rgba(30, 30, 30, 0.95);
            padding: 3px 6px;
            border-radius: 4px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 14px;
            color: #d0d0d0;
        }
        
        .markdown-table {
            width: 100%;
            margin: 10px 0;
            background: rgba(30, 30, 30, 0.8);
            border-radius: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            display: block;
            font-size: 13px;
        }
        
        .markdown-table table {
            width: 100%;
            min-width: 300px;
        }
        
        .markdown-table th {
            background: rgba(40, 40, 40, 0.9);
            padding: 8px 10px;
            text-align: left;
            font-weight: 700;
            border-bottom: 1px solid rgba(80, 80, 80, 0.3);
        }
        
        .markdown-table td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(80, 80, 80, 0.2);
        }
        
        .markdown-table tr:last-child td {
            border-bottom: none;
        }
        
        ::-webkit-scrollbar {
            width: 4px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 100, 100, 0.5);
            border-radius: 2px;
        }
        
        /* Enhanced Highlight.js Syntax Highlighting */
        .hljs {
            background: rgba(25, 25, 25, 0.98) !important;
            color: #e0e0e0 !important;
        }
        
        .hljs-comment,
        .hljs-quote {
            color: #7C7C7C;
        }
        
        .hljs-variable,
        .hljs-template-variable,
        .hljs-tag,
        .hljs-name,
        .hljs-selector-id,
        .hljs-selector-class,
        .hljs-regexp,
        .hljs-deletion {
            color: #96CBFE;
        }
        
        .hljs-number,
        .hljs-built_in,
        .hljs-builtin-name,
        .hljs-literal,
        .hljs-type,
        .hljs-params,
        .hljs-meta,
        .hljs-link {
            color: #A8FF60;
        }
        
        .hljs-attribute {
            color: #EDEDED;
        }
        
        .hljs-string,
        .hljs-symbol,
        .hljs-bullet,
        .hljs-addition {
            color: #CFCB90;
        }
        
        .hljs-title,
        .hljs-section {
            color: #FFD2A7;
        }
        
        .hljs-keyword,
        .hljs-selector-tag {
            color: #E0C589;
        }
        
        /* Ensure proper contrast in our dark theme */
        pre.hljs {
            background: rgba(25, 25, 25, 0.98) !important;
        }
        
        code.hljs {
            background: transparent !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1>🎯 Nvidia</h1>
                <div class="status" id="status">●</div>
            </div>
            <div class="btn-group">
                <button class="btn" onclick="captureScreen()">📸 Capture</button>
                <button class="btn btn-debug" onclick="debugCode()">🐛 Debug</button>
                <button class="btn btn-mic" id="micBtn" onclick="toggleMic()">🎤 Mic</button>
                <button class="btn" onclick="clearHistory()" style="background: rgba(231, 76, 60, 0.3); border-color: rgba(231, 76, 60, 0.5);">🗑️ Clear</button>
            </div>
        </header>
        
        <div class="chat-container" id="chat"></div>
        <div class="multi-capture-indicator" id="multiCaptureIndicator" aria-live="polite">
            <div class="mc-title">Multi-capture</div>
            <div class="mc-count" id="multiCaptureCountText">0 chunks</div>
            <div class="mc-hint">Ctrl+Alt+X to send - Ctrl+Alt+Z to cancel</div>
            <button class="mc-cancel" id="multiCaptureCancelBtn" type="button">Cancel</button>
        </div>
        <button class="manual-search-toggle" id="manualSearchToggle" type="button" aria-label="Open manual search" title="Manual search (Ctrl+Alt+S)">
            <span aria-hidden="true">&#128269;</span>
        </button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/rust.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/go.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
    <script src="/static/js/search.js"></script>
    <!-- Ensure code highlighting after rendering -->
    <script>
        // Initialize Highlight.js
        hljs.highlightAll();
        
        // Auto-highlight any newly added code blocks
        function highlightNewCode() {
            document.querySelectorAll('pre code:not(.hljs)').forEach(el => {
                hljs.highlightElement(el);
            });
        }
        
        // Observe DOM for new code blocks
        const observer = new MutationObserver(highlightNewCode);
        observer.observe(document.getElementById('chat'), { childList: true, subtree: true });
    </script>
    <script>
        let ws;
        let currentAnswer = null;
        let reconnectAttempts = 0;
        let reconnectTimer = null;
        let messageQueue = [];
        let isConnected = false;
        const MAX_RECONNECT_DELAY = 30000; // 30 seconds max
        const BASE_DELAY = 1000; // 1 second base
        
        // Microphone recording state
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        
        let multiCaptureCount = 0;
        
        // Restore chat history on load
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('chat_history');
            if (saved) {
                document.getElementById('chat').innerHTML = saved;
            }
            
            const cancelBtn = document.getElementById('multiCaptureCancelBtn');
            if (cancelBtn) {
                cancelBtn.addEventListener('click', cancelMultiCapture);
            }
        });
        
        // Save chat history whenever it changes
        function saveChat() {
            const chatHtml = document.getElementById('chat').innerHTML;
            try {
                localStorage.setItem('chat_history', chatHtml);
            } catch (e) {
                if (e.name === 'QuotaExceededError') {
                    console.warn('localStorage quota exceeded, removing old messages');
                    const messages = document.getElementById('chat').querySelectorAll('.message');
                    const keepCount = Math.floor(messages.length * 0.5);
                    for (let i = 0; i < messages.length - keepCount; i++) {
                        messages[i].remove();
                    }
                    try {
                        localStorage.setItem('chat_history', document.getElementById('chat').innerHTML);
                    } catch (e2) {
                        console.error('Still failed after cleanup, clearing all history');
                        localStorage.removeItem('chat_history');
                    }
                }
            }
        }

        function updateMultiCaptureIndicator(count) {
            multiCaptureCount = count;
            const indicator = document.getElementById('multiCaptureIndicator');
            const countText = document.getElementById('multiCaptureCountText');
            if (!indicator || !countText) return;
            
            countText.textContent = `${count} ${count === 1 ? 'chunk' : 'chunks'}`;
            if (count > 0) {
                indicator.classList.add('active');
            } else {
                indicator.classList.remove('active');
            }
        }
        
        function cancelMultiCapture() {
            updateMultiCaptureIndicator(0);
            sendMessage('multi_capture_cancel');
        }
        
        function connect() {
            // Clear any existing reconnect timer
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
            
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            console.log(`Connecting to WebSocket (attempt ${reconnectAttempts + 1})...`);
            
            try {
                ws = new WebSocket(wsUrl);
            } catch (error) {
                console.error('WebSocket creation failed:', error);
                scheduleReconnect();
                return;
            }
            
            ws.onopen = () => {
                console.log('✓ WebSocket connected');
                isConnected = true;
                reconnectAttempts = 0;
                document.getElementById('status').textContent = '●';
                document.getElementById('status').classList.add('connected');
                
                // Flush queued messages
                if (messageQueue.length > 0) {
                    console.log(`Flushing ${messageQueue.length} queued messages`);
                    messageQueue.forEach(msg => {
                        if (ws.readyState === WebSocket.OPEN) {
                            ws.send(msg);
                        }
                    });
                    messageQueue = [];
                }
            };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (error) {
                    console.error('Failed to parse message:', error);
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
            
            ws.onclose = (event) => {
                isConnected = false;
                console.log(`WebSocket closed (code: ${event.code}, reason: ${event.reason})`);
                document.getElementById('status').textContent = '●';
                document.getElementById('status').classList.remove('connected');
                
                // Don't reconnect if closed normally (code 1000)
                if (event.code !== 1000) {
                    scheduleReconnect();
                }
            };
        }
        
        function scheduleReconnect() {
            reconnectAttempts++;
            const delay = Math.min(BASE_DELAY * Math.pow(2, reconnectAttempts - 1), MAX_RECONNECT_DELAY);
            
            console.log(`Reconnecting in ${delay}ms (attempt ${reconnectAttempts})...`);
            document.getElementById('status').textContent = `⟳ ${Math.round(delay/1000)}s`;
            
            reconnectTimer = setTimeout(() => {
                connect();
            }, delay);
        }
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    connect();
                }
            }
        });
        
        window.addEventListener('online', () => {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                connect();
            }
        });

        function sendMessage(message) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(message);
            } else {
                console.warn('WebSocket not connected, queuing message');
                messageQueue.push(message);
                // Limit queue size to prevent memory issues
                if (messageQueue.length > 50) {
                    messageQueue.shift();
                }
            }
        }
        
        function handleMessage(data) {
            const chat = document.getElementById('chat');
            
            if (data.type === 'multi_capture_update') {
                const count = Number.isFinite(data.count) ? data.count : parseInt(data.count || 0, 10);
                updateMultiCaptureIndicator(Number.isFinite(count) ? count : 0);
            } else if (data.type === 'toggle_search') {
                if (searchModal && searchModal.classList.contains('active')) {
                    closeSearchModal();
                } else {
                    openSearchModal();
                }
            } else if (data.type === 'search_enter') {
                console.log('🔍 [SEARCH LOG] Search enter event received');
                if (searchInput && searchModal && searchModal.classList.contains('active')) {
                    const question = searchInput.value.trim();
                    console.log('🔍 [SEARCH LOG] Question from search input:', question);
                    if (question) {
                        submitManualQuestion(question);
                        searchInput.value = '';
                    }
                    closeSearchModal();
                }
            } else if (data.type === 'search_keystroke') {
                // Add keystrokes to search input
                if (searchInput && searchModal.classList.contains('active')) {
                    searchInput.value += data.text;
                }
            } else if (data.type === 'search_backspace') {
                // Handle backspace
                if (searchInput && searchModal.classList.contains('active')) {
                    searchInput.value = searchInput.value.slice(0, -1);
                }
            } else if (data.type === 'recapture_needed') {
                alert(data.message);
            } else if (data.type === 'transcription') {
                console.log('🔍 [SEARCH LOG] Received transcription from backend:', data.text);
                const msg = document.createElement('div');
                msg.className = 'message';
                msg.innerHTML = `
                    <div class="msg-q">
                        <div class="msg-label">Q</div>
                        <div class="msg-content">${escapeHtml(data.text)}</div>
                        <button class="solve-btn" onclick="solveProblem(this, '${escapeHtml(data.text).replace(/'/g, "\\'")}')">🚀 Solve</button>
                    </div>
                    <div class="msg-a">
                        <div class="msg-label">A</div>
                        <div class="msg-content"><span class="loading">🤔 Thinking (using code interpreter & browser search)</span></div>
                    </div>
                `;
                chat.appendChild(msg);
                currentAnswer = msg.querySelector('.msg-a .msg-content');
                saveChat();
                scrollToBottom();
            } else if (data.type === 'answer' && currentAnswer) {
                console.log('🔍 [SEARCH LOG] Received answer from AI model (length: ' + data.text.length + ')');
                console.log('🔍 [SEARCH LOG] Answer preview:', data.text.substring(0, 200) + (data.text.length > 200 ? '...' : ''));
                try {
                    currentAnswer.innerHTML = formatAnswer(data.text);
                    saveChat();
                    setTimeout(() => {
                        currentAnswer.querySelectorAll('pre code').forEach(el => {
                            hljs.highlightElement(el);
                        });
                    }, 50);
                } catch (error) {
                    console.error('Error formatting answer:', error);
                    // Fallback: display raw text if formatting fails
                    currentAnswer.innerHTML = '<p>' + escapeHtml(data.text) + '</p>';
                }
            }
        }
        
        function formatAnswer(text) {
            // Groq-style markdown rendering with enhanced formatting
            if (!text || text.trim() === '') {
                return '<p>No response</p>';
            }
            
            let result = text;
            
            // Step 1: Process code blocks FIRST (before any HTML escaping)
            const codeBlocks = [];
            let codeBlockIndex = 0;
            
            // Extract and replace code blocks with placeholders
            result = result.replace(/```([\w]*)\n?([\s\S]*?)```/g, (match, lang, code) => {
                const placeholder = `__CODE_BLOCK_${codeBlockIndex}__`;
                const cleanCode = code.replace(/^\n+|\n+$/g, ''); // Remove leading/trailing newlines
                
                // Default to cpp if no language specified or if it's a common C++ variant
                let detectedLang = lang ? lang.toLowerCase() : '';
                if (!detectedLang || detectedLang === 'c++' || detectedLang === 'cxx') {
                    detectedLang = 'cpp';
                }
                
                // Map common language names to highlight.js classes
                const langMap = {
                    'c++': 'cpp',
                    'cpp': 'cpp',
                    'cxx': 'cpp',
                    'python': 'python',
                    'py': 'python',
                    'javascript': 'javascript',
                    'js': 'javascript',
                    'typescript': 'typescript',
                    'ts': 'typescript',
                    'java': 'java',
                    'rust': 'rust',
                    'go': 'go',
                    'golang': 'go',
                    'sql': 'sql',
                    'bash': 'bash',
                    'shell': 'bash',
                    'sh': 'bash'
                };
                
                const langClass = langMap[detectedLang] || 'cpp'; // Default to cpp for interview problems
                const displayLang = detectedLang === 'cpp' ? 'C++' : (lang || 'Code');
                
                codeBlocks[codeBlockIndex] = `<div class="code-block">
                    <div class="code-header">
                        <span class="code-lang">${displayLang}</span>
                        <button class="copy-btn" onclick="copyCode(this)">Copy</button>
                    </div>
                    <pre><code class="hljs ${langClass}">${escapeHtml(cleanCode)}</code></pre>
                </div>`;
                
                codeBlockIndex++;
                return placeholder;
            });
            
            // Step 2: Process inline code (before HTML escaping)
            const inlineCodes = [];
            let inlineCodeIndex = 0;
            
            result = result.replace(/`([^`\n]+)`/g, (match, code) => {
                const placeholder = `__INLINE_CODE_${inlineCodeIndex}__`;
                inlineCodes[inlineCodeIndex] = `<code>${escapeHtml(code)}</code>`;
                inlineCodeIndex++;
                return placeholder;
            });
            
            // Step 3: Now escape HTML for the remaining text
            result = escapeHtml(result);
            
            // Step 4: Process markdown formatting (Groq-style)
            // Bold and italic (non-greedy matching, avoid crossing newlines)
            result = result.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
            result = result.replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
            
            // Headings with proper spacing (Groq-style classes)
            result = result.replace(/^### (.+)$/gm, '<h3 class="heading3">$1</h3>');
            result = result.replace(/^## (.+)$/gm, '<h2 class="heading2">$1</h2>');
            result = result.replace(/^# (.+)$/gm, '<h1 class="heading1">$1</h1>');
            
            // Horizontal rules
            result = result.replace(/^---$/gm, '<hr class="my-10">');
            
            // Step 5: Process tables (Groq-style)
            result = formatTables(result);
            
            // Step 6: Process lists with proper nesting and RTL support
            const lines = result.split('\n');
            const processedLines = [];
            let inList = false;
            let inOrderedList = false;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const isUnorderedListItem = /^- (.+)/.test(line);
                const isOrderedListItem = /^\d+\. (.+)/.test(line);
                const isListItem = isUnorderedListItem || isOrderedListItem;
                
                // Handle list transitions
                if (isUnorderedListItem && !inList) {
                    processedLines.push('<ul class="ml-5 mb-4 list-disc">');
                    inList = true;
                    inOrderedList = false;
                } else if (isOrderedListItem && !inOrderedList) {
                    if (inList) processedLines.push('</ul>');
                    processedLines.push('<ol class="ml-5 mb-4 list-decimal">');
                    inList = true;
                    inOrderedList = true;
                } else if (!isListItem && inList) {
                    processedLines.push(inOrderedList ? '</ol>' : '</ul>');
                    inList = false;
                    inOrderedList = false;
                }
                
                if (isUnorderedListItem) {
                    processedLines.push(line.replace(/^- (.+)/, '<li class="ml-5">$1</li>'));
                } else if (isOrderedListItem) {
                    processedLines.push(line.replace(/^\d+\. (.+)/, '<li class="ml-5">$1</li>'));
                } else {
                    processedLines.push(line);
                }
            }
            
            if (inList) {
                processedLines.push(inOrderedList ? '</ol>' : '</ul>');
            }
            
            result = processedLines.join('\n');
            
            // Step 7: Process paragraphs with proper spacing and RTL detection
            const paragraphs = result.split('\n\n');
            const formattedParagraphs = paragraphs.map(p => {
                const trimmed = p.trim();
                if (!trimmed) return '';
                
                // Don't wrap code blocks, headings, lists, tables, or hr
                if (trimmed.includes('__CODE_BLOCK_') || 
                    trimmed.startsWith('<h') || 
                    trimmed.startsWith('<ul>') || 
                    trimmed.startsWith('<ol>') ||
                    trimmed.startsWith('<li>') ||
                    trimmed.startsWith('<table>') ||
                    trimmed.startsWith('<div class="markdown-table">') ||
                    trimmed.startsWith('<hr>')) {
                    return trimmed;
                }
                
                // Convert single line breaks to <br> within paragraphs
                const withBreaks = trimmed.replace(/\n/g, '<br>');
                
                // Detect RTL text (basic detection for Arabic, Hebrew, etc.)
                const rtlPattern = /[\u0590-\u05FF\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/;
                const isRTL = rtlPattern.test(withBreaks);
                
                return `<p class="${isRTL ? 'text-right' : 'text-left'} mb-4"${isRTL ? ' dir="rtl"' : ''}>${withBreaks}</p>`;
            });
            
            result = formattedParagraphs.join('\n\n');
            
            // Step 8: Restore code blocks
            for (let i = 0; i < codeBlocks.length; i++) {
                result = result.replace(`__CODE_BLOCK_${i}__`, codeBlocks[i]);
            }
            
            // Step 9: Restore inline code
            for (let i = 0; i < inlineCodes.length; i++) {
                result = result.replace(`__INLINE_CODE_${i}__`, inlineCodes[i]);
            }
            
            // Step 10: Trigger syntax highlighting with Highlight.js
            setTimeout(() => {
                document.querySelectorAll('pre code:not(.hljs)').forEach(el => {
                    try {
                        // Auto-detect language if not specified
                        hljs.highlightElement(el);
                        console.log('Highlighted element:', el.className);
                    } catch (error) {
                        console.warn('Highlight.js highlighting failed:', error);
                        // Fallback: at least ensure proper formatting
                        el.classList.add('hljs');
                    }
                });
                
                // Force re-highlight any remaining unhighlighted code
                setTimeout(() => {
                    document.querySelectorAll('pre code:not(.hljs)').forEach(el => {
                        try {
                            hljs.highlightElement(el);
                        } catch (e) {
                            console.warn('Fallback highlighting failed:', e);
                            el.classList.add('hljs');
                        }
                    });
                }, 200);
            }, 100);
            
            return result;
        }
        
        function formatTables(text) {
            const lines = text.split('\n');
            let result = [];
            let inTable = false;
            let tableRows = [];
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                if (line.includes('|')) {
                    if (!inTable) {
                        inTable = true;
                        tableRows = [];
                    }
                    
                    // Skip separator lines (e.g., |---|---|)
                    if (line.match(/^\|?[\s:-]+\|[\s:-]+/)) {
                        continue;
                    }
                    
                    const cells = line.split('|').map(c => c.trim()).filter(c => c);
                    tableRows.push(cells);
                } else {
                    if (inTable && tableRows.length > 0) {
                        let table = '<div class="markdown-table"><table class="table-auto w-full mb-4">';
                        tableRows.forEach((row, idx) => {
                            if (idx === 0) {
                                table += '<thead class="text-left"><tr>';
                                row.forEach(cell => {
                                    // Detect RTL content in table cells
                                    const rtlPattern = /[\u0590-\u05FF\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/;
                                    const isRTL = rtlPattern.test(cell);
                                    table += `<th class="p-2 font-bold${isRTL ? ' text-right' : ''}"${isRTL ? ' dir="rtl"' : ''}>${cell}</th>`;
                                });
                                table += '</tr></thead><tbody>';
                            } else {
                                table += '<tr>';
                                row.forEach(cell => {
                                    // Detect RTL content in table cells
                                    const rtlPattern = /[\u0590-\u05FF\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/;
                                    const isRTL = rtlPattern.test(cell);
                                    table += `<td class="p-2${isRTL ? ' text-right' : ''}"${isRTL ? ' dir="rtl"' : ''}>${cell}</td>`;
                                });
                                table += '</tr>';
                            }
                        });
                        table += '</tbody></table></div>';
                        result.push(table);
                        tableRows = [];
                        inTable = false;
                    }
                    result.push(line);
                }
            }
            
            if (inTable && tableRows.length > 0) {
                let table = '<div class="markdown-table"><table class="table-auto w-full mb-4">';
                tableRows.forEach((row, idx) => {
                    if (idx === 0) {
                        table += '<thead class="text-left"><tr>';
                        row.forEach(cell => {
                            const rtlPattern = /[\u0590-\u05FF\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/;
                            const isRTL = rtlPattern.test(cell);
                            table += `<th class="p-2 font-bold${isRTL ? ' text-right' : ''}"${isRTL ? ' dir="rtl"' : ''}>${cell}</th>`;
                        });
                        table += '</tr></thead><tbody>';
                    } else {
                        table += '<tr>';
                        row.forEach(cell => {
                            const rtlPattern = /[\u0590-\u05FF\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/;
                            const isRTL = rtlPattern.test(cell);
                            table += `<td class="p-2${isRTL ? ' text-right' : ''}"${isRTL ? ' dir="rtl"' : ''}>${cell}</td>`;
                        });
                        table += '</tr>';
                    }
                });
                table += '</tbody></table></div>';
                result.push(table);
            }
            
            return result.join('\n');
        }
        
        function copyCode(btn) {
            const code = btn.closest('.code-block').querySelector('code');
            navigator.clipboard.writeText(code.textContent).then(() => {
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function scrollToBottom() {
            // Don't auto-scroll - let user control scroll position
        }
        
        function captureScreen() {
            sendMessage('capture_screen');
        }
        
        function debugCode() {
            sendMessage('debug_code');
        }
        
        function clearHistory() {
            if (confirm('Clear all chat history?')) {
                localStorage.removeItem('chat_history');
                document.getElementById('chat').innerHTML = '';
                currentAnswer = null;
            }
        }
        
        async function toggleMic() {
            if (!isRecording) {
                await startRecording();
            } else {
                await stopRecording();
            }
        }
        
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await sendAudioToServer(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start();
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
                document.getElementById('micBtn').textContent = '⏹️ Stop';
                console.log('Recording started...');
            } catch (error) {
                console.error('Microphone access denied:', error);
                alert('Microphone access denied. Please allow microphone permissions.');
            }
        }
        
        async function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('micBtn').classList.remove('recording');
                document.getElementById('micBtn').textContent = '🎤 Mic';
                console.log('Recording stopped.');
            }
        }
        
        async function sendAudioToServer(audioBlob) {
            const reader = new FileReader();
            reader.onloadend = () => {
                const base64Audio = reader.result.split(',')[1];
                sendMessage(JSON.stringify({
                    type: 'mic_audio',
                    audio: base64Audio
                }));
                console.log('Audio sent to server');
            };
            reader.readAsDataURL(audioBlob);
        }
        
        function solveProblem(btn, questionText) {
            const unescaped = questionText.replace(/\\'/g, "'");
            const chat = document.getElementById('chat');
            
            const msg = document.createElement('div');
            msg.className = 'message';
            msg.innerHTML = `
                <div class="msg-q">
                    <div class="msg-label">Q</div>
                    <div class="msg-content">${escapeHtml(unescaped)}</div>
                </div>
                <div class="msg-a">
                    <div class="msg-label">A</div>
                    <div class="msg-content"><span class="loading">🤔 Solving with OSS-120B...</span></div>
                </div>
            `;
            chat.appendChild(msg);
            currentAnswer = msg.querySelector('.msg-a .msg-content');
            saveChat();
            
            sendMessage(JSON.stringify({
                type: 'solve_problem',
                text: unescaped
            }));
        }
        
        connect();
    </script>
