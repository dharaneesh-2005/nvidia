[package]
name = "nvidia-tauri"
version = "0.1.0"
description = "Nvidia - Native PiP Window with Screen Capture Exclusion"
authors = ["Nvidia"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[lib]
name = "nvidia_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nvidia-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tokio-tungstenite = "0.21"
futures = "0.3"
reqwest = { version = "0.11", features = ["json"] }

# Windows API for SetWindowDisplayAffinity and cursor hiding
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
] }
raw-window-handle = "0.6"

# macOS API for screen capture exclusion
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
